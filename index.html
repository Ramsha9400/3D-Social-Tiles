<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Social Tiles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shared gradient used by the Instagram logo when it is active -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#FEDA75"/>
        <stop offset=".35" stop-color="#FA7E1E"/>
        <stop offset=".65" stop-color="#D62976"/>
        <stop offset="1" stop-color="#4F5BD5"/>
      </linearGradient>
    </defs>
  </svg>

  <main class="demo" aria-labelledby="demo-title">
    <h1 id="demo-title" class="demo__title">Social Tiles</h1>

    <div class="demo__controls">
      <label class="visually-hidden" for="search">Search tiles</label>
      <input id="search" class="demo__search" type="search" placeholder="Search tiles..." autocomplete="off">
      <button id="reset" class="demo__btn" type="button">Reset</button>
      <button id="sound" class="demo__btn" type="button" aria-pressed="true">Sound: On</button>
    </div>

    <div class="stage" id="stage" role="group" aria-label="Social media tiles">

      <div class="slot">
        <button class="tile" type="button" data-id="facebook" data-label="Facebook" aria-pressed="false" aria-label="Facebook" style="--brand:#1877F2">
          <span class="tile__glass">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="shape" cx="12" cy="12" r="10"/>
              <path class="mark" d="M13.5 22v-7.5h2.5l.4-3h-2.9V9.7c0-.9.3-1.5 1.5-1.5h1.5V5.6c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.2H8.8v3h2.5V22z"/>
            </svg>
          </span>
        </button>
        <span class="tile__label">Facebook</span>
      </div>

      <div class="slot">
        <button class="tile" type="button" data-id="instagram" data-label="Instagram" aria-pressed="false" aria-label="Instagram" style="--brand:#E1306C">
          <span class="tile__glass">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
              <rect class="ig" x="3" y="3" width="18" height="18" rx="5" fill="none" stroke-width="2.2"/>
              <circle class="ig" cx="12" cy="12" r="4" fill="none" stroke-width="2.2"/>
              <circle class="igdot" cx="17.4" cy="6.6" r="1.3"/>
            </svg>
          </span>
        </button>
        <span class="tile__label">Instagram</span>
      </div>

      <div class="slot">
        <button class="tile" type="button" data-id="tiktok" data-label="TikTok" aria-pressed="false" aria-label="TikTok" style="--brand:#111111">
          <span class="tile__glass">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
              <path class="tt-c" transform="translate(-.9 -.6)" d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.2v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.6a6 6 0 1 0 5 5.9V9.1a7.6 7.6 0 0 0 4.4 1.4V7.3a4.3 4.3 0 0 1-3.3-1.5z"/>
              <path class="tt-p" transform="translate(.9 .6)" d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.2v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.6a6 6 0 1 0 5 5.9V9.1a7.6 7.6 0 0 0 4.4 1.4V7.3a4.3 4.3 0 0 1-3.3-1.5z"/>
              <path class="shape" d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.2v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.6a6 6 0 1 0 5 5.9V9.1a7.6 7.6 0 0 0 4.4 1.4V7.3a4.3 4.3 0 0 1-3.3-1.5z"/>
            </svg>
          </span>
        </button>
        <span class="tile__label">TikTok</span>
      </div>

      <div class="slot">
        <button class="tile" type="button" data-id="pinterest" data-label="Pinterest" aria-pressed="false" aria-label="Pinterest" style="--brand:#E60023">
          <span class="tile__glass">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="shape" cx="12" cy="12" r="10"/>
              <text class="mark" x="12" y="16.8" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="13">P</text>
            </svg>
          </span>
        </button>
        <span class="tile__label">Pinterest</span>
      </div>

      <div class="slot">
        <button class="tile" type="button" data-id="linkedin" data-label="LinkedIn" aria-pressed="false" aria-label="LinkedIn" style="--brand:#0A66C2">
          <span class="tile__glass">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
              <rect class="shape" x="2" y="2" width="20" height="20" rx="4"/>
              <path class="mark" d="M6.2 9.6h2.6v8.2H6.2zM7.5 5.4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM10.6 9.6h2.5v1.2c.4-.7 1.3-1.4 2.7-1.4 2.8 0 3.3 1.8 3.3 4.2v4.2h-2.6v-3.7c0-.9 0-2.1-1.3-2.1s-1.5 1-1.5 2v3.8h-2.6z"/>
            </svg>
          </span>
        </button>
        <span class="tile__label">LinkedIn</span>
      </div>

    </div>

    <p class="demo__hint" id="hint" aria-live="polite">Hover a tile to see its brand color. Click to select.</p>
  </main>

  <div class="credit">Created by @stackanddstyle</div>
  <script src="script.js"></script>
</body>
</html>
